<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinematic OTP Deck Verification</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #141721;
      --border: rgba(255, 255, 255, 0.08);
      --ice: #00f2fe;
      --success: #00f59b;
      --text: #ffffff;
      --text-dim: #747b90;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .badge {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #5d6479;
      margin-bottom: 8px;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 35px;
    }

    .header-title span {
      background: linear-gradient(90deg, #60a5fa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .deck-container {
      position: relative;
      width: 360px;
      height: 380px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 24px;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8),
                  inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .card-top {
      text-align: center;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
      transition: color 0.4s ease;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-dim);
      transition: color 0.4s ease;
    }

    /* Đấu trường trung tâm */
    .deck-arena {
      position: relative;
      width: 240px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Thẻ slot nhập số */
    .slot {
      position: absolute;
      width: 48px;
      height: 66px;
      background: #1b1f2c;
      border: 1.5px solid #293044;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 320%;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .slot input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      caret-color: var(--ice);
    }

    .slot.active {
      border-color: var(--ice);
      box-shadow: 0 0 18px rgba(0, 242, 254, 0.35);
    }

    /* Thẻ trung tâm biến hình (Morph Box) */
    .morph-card {
      position: absolute;
      width: 48px;
      height: 66px;
      border-radius: 14px;
      background: #1b1f2c;
      border: 2px solid transparent;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      z-index: 10;
    }

    /* Vòng tròn xoay quét mã */
    .scan-ring {
      position: absolute;
      inset: -4px;
      border-radius: inherit;
      pointer-events: none;
    }

    .scan-ring svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .scan-ring rect {
      fill: none;
      stroke: var(--ice);
      stroke-width: 2.5;
      stroke-dasharray: 80 140;
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px var(--ice));
      animation: rotateScan 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes rotateScan {
      0% { stroke-dashoffset: 220; }
      100% { stroke-dashoffset: 0; }
    }

    /* SVG Tick */
    .tick-svg {
      width: 32px;
      height: 32px;
      opacity: 0;
      transform: scale(0.5);
    }

    .tick-path {
      fill: none;
      stroke: var(--success);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      filter: drop-shadow(0 0 8px rgba(0, 245, 155, 0.8));
    }

    /* Sóng chấn động bung ra khi xong (Shockwave) */
    .shockwave {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid var(--success);
      pointer-events: none;
      opacity: 0;
    }

    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--success);
      border-radius: 50%;
      opacity: 0;
      box-shadow: 0 0 8px var(--success);
    }

    .footer-action {
      font-size: 13px;
      color: var(--text-dim);
    }

    .footer-action a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
      cursor: pointer;
    }

    .hint-text {
      margin-top: 28px;
      font-size: 13px;
      color: #555b6e;
    }

    .hint-text b {
      color: #7e879c;
    }
  </style>
</head>
<body>

  <div class="badge">Component · 100</div>
  <div class="header-title">OTP Verification <span>DECK</span></div>

  <div class="deck-container">
    <div class="card-top">
      <div class="title" id="statusTitle">Verify your code</div>
      <div class="subtitle" id="statusSub">Enter the 4-digit code sent to you.</div>
    </div>

    <div class="deck-arena" id="arena">
      <!-- 4 ô nhập số -->
      <div class="slot" data-index="0"><input type="text" maxlength="1" inputmode="numeric"></div>
      <div class="slot" data-index="1"><input type="text" maxlength="1" inputmode="numeric"></div>
      <div class="slot" data-index="2"><input type="text" maxlength="1" inputmode="numeric"></div>
      <div class="slot" data-index="3"><input type="text" maxlength="1" inputmode="numeric"></div>

      <!-- Thẻ gộp Morphing Box -->
      <div class="morph-card" id="morphCard">
        <div class="scan-ring" id="scanRing">
          <svg width="100%" height="100%">
            <rect id="rectRing" x="0" y="0" width="100%" height="100%" rx="18" ry="18"></rect>
          </svg>
        </div>
        
        <svg class="tick-svg" id="tickSvg" viewBox="0 0 32 32">
          <path class="tick-path" id="tickPath" d="M7 16.5 L13 22.5 L25 10.5"></path>
        </svg>

        <div class="shockwave" id="shockwave"></div>
      </div>
    </div>

    <div class="footer-action">
      Didn't get a code? <a href="#" id="resendBtn">Resend</a>
    </div>
  </div>

  <div class="hint-text">
    Nhấn phím <b>Enter — 1234</b> để xem toàn bộ chuỗi animation.
  </div>

  <script>
    const slots = Array.from(document.querySelectorAll('.slot'));
    const inputs = Array.from(document.querySelectorAll('.slot input'));
    const morphCard = document.getElementById('morphCard');
    const scanRing = document.getElementById('scanRing');
    const rectRing = document.getElementById('rectRing');
    const tickSvg = document.getElementById('tickSvg');
    const tickPath = document.getElementById('tickPath');
    const shockwave = document.getElementById('shockwave');
    const title = document.getElementById('statusTitle');
    const subtitle = document.getElementById('statusSub');
    const arena = document.getElementById('arena');

    const ANG = [-12, -4, 4, 12];
    const dx = [-75, -25, 25, 75];

    // Xòe 4 lá bài ra
    function spreadCards() {
      morphCard.style.display = 'none';
      slots.forEach((slot, i) => {
        slot.style.display = 'flex';
        slot.style.opacity = '1';
        slot.animate([
          { transform: 'translate(0, 0) rotate(0deg) scale(0.9)', opacity: 0 },
          { transform: `translate(${dx[i]}px, 0) rotate(${ANG[i]}deg) scale(1)`, opacity: 1 }
        ], {
          duration: 550,
          delay: i * 40,
          fill: 'forwards',
          easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
        });
      });
      setTimeout(() => inputs[0].focus(), 350);
    }

    // Hiệu ứng pháo sáng bung tỏa khi tick
    function triggerSparks() {
      const count = 12;
      for (let i = 0; i < count; i++) {
        const spark = document.createElement('div');
        spark.classList.add('spark');
        arena.appendChild(spark);

        const angle = (i / count) * 2 * Math.PI;
        const dist = 55 + Math.random() * 20;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;

        spark.animate([
          { transform: 'translate(-50%, -50%) scale(1.5)', opacity: 1 },
          { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
        ], {
          duration: 600,
          easing: 'cubic-bezier(0.1, 0.9, 0.2, 1)'
        }).onfinish = () => spark.remove();
      }
    }

    // Tiến trình: Gộp bài -> Xoay quét -> Từ từ hiện Tick
    function startVerificationProcess() {
      // 1. Gộp các lá bài về lại tâm (Snap tụ lại)
      slots.forEach((slot, i) => {
        slot.animate([
          { transform: `translate(${dx[i]}px, 0) rotate(${ANG[i]}deg) scale(1)`, opacity: 1 },
          { transform: 'translate(0, 0) rotate(0deg) scale(0.95)', opacity: 0.7 }
        ], {
          duration: 400,
          delay: (3 - i) * 30, // gom tuần tự từ ngoài vào
          fill: 'forwards',
          easing: 'cubic-bezier(0.4, 0, 0.2, 1)'
        });
      });

      // 2. Chuyển sang lá bài trung tâm (Morphing) & chạy hiệu ứng quét
      setTimeout(() => {
        slots.forEach(s => s.style.display = 'none');
        morphCard.style.display = 'flex';
        morphCard.style.opacity = '1';

        title.textContent = "Checking your code";
        subtitle.textContent = "One moment — confirming authenticity.";

        // Biến thành hình vuông bo tròn mềm mại
        morphCard.animate([
          { width: '48px', height: '66px', borderRadius: '14px', transform: 'scale(0.95)' },
          { width: '64px', height: '64px', borderRadius: '20px', transform: 'scale(1)' }
        ], {
          duration: 400,
          fill: 'forwards',
          easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)'
        });

        // 3. Sau khi quét 1.6s -> Tiến hành hiện Tick mượt mà
        setTimeout(revealSuccessTick, 1600);
      }, 450);
    }

    // Hiệu ứng hiện Tick
    function revealSuccessTick() {
      // Dừng vòng xoay cyan và đổi viền sang Emerald Green
      rectRing.style.animation = 'none';
      rectRing.style.stroke = 'var(--success)';
      rectRing.style.strokeDasharray = 'none';
      rectRing.style.filter = 'drop-shadow(0 0 12px rgba(0, 245, 155, 0.7))';

      // Nảy nhẹ thẻ (Scale Pop)
      morphCard.animate([
        { transform: 'scale(1)' },
        { transform: 'scale(1.12)' },
        { transform: 'scale(1)' }
      ], {
        duration: 400,
        easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)'
      });

      // Bắn sóng Shockwave
      shockwave.animate([
        { transform: 'scale(0.8)', opacity: 0.8 },
        { transform: 'scale(2.2)', opacity: 0 }
      ], {
        duration: 650,
        easing: 'ease-out'
      });

      // Hiện dấu Tick và vẽ nét
      tickSvg.style.opacity = '1';
      tickSvg.animate([
        { transform: 'scale(0.4) rotate(-10deg)', opacity: 0 },
        { transform: 'scale(1) rotate(0deg)', opacity: 1 }
      ], {
        duration: 400,
        easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)'
      });

      tickPath.animate([
        { strokeDashoffset: 40 },
        { strokeDashoffset: 0 }
      ], {
        duration: 450,
        delay: 150,
        fill: 'forwards',
        easing: 'cubic-bezier(0.65, 0, 0.35, 1)'
      });

      // Bắn các hạt pháo sáng sau khi nét vẽ hoàn thành
      setTimeout(triggerSparks, 350);

      title.textContent = "Verified Successfully!";
      title.style.color = "var(--success)";
      subtitle.textContent = "Your access has been granted.";
    }

    // Lắng nghe nhập liệu
    inputs.forEach((input, index) => {
      input.addEventListener('focus', () => slots[index].classList.add('active'));
      input.addEventListener('blur', () => slots[index].classList.remove('active'));

      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val;
        if (val && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
        if (inputs.every(i => i.value.length === 1)) {
          startVerificationProcess();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    // Enter phím tắt test mã "1234"
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        '1234'.split('').forEach((num, i) => inputs[i].value = num);
        startVerificationProcess();
      }
    });

    // Nút Resend làm mới lại trạng thái ban đầu
    document.getElementById('resendBtn').addEventListener('click', (e) => {
      e.preventDefault();
      rectRing.style.animation = '';
      rectRing.style.stroke = 'var(--ice)';
      rectRing.style.strokeDasharray = '80 140';
      rectRing.style.filter = '';
      tickSvg.style.opacity = '0';
      tickPath.style.strokeDashoffset = '40';
      inputs.forEach(i => i.value = '');
      title.textContent = "Verify your code";
      title.style.color = "var(--text)";
      subtitle.textContent = "Enter the 4-digit code sent to you.";
      spreadCards();
    });

    window.onload = spreadCards;
  </script>
</body>
</html>
