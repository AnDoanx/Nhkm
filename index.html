<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification Deck - Success Animation</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #16181f;
      --border: #232733;
      --ice: #00f2fe;
      --success: #10b981;
      --text: #ffffff;
      --text-dim: #7f8699;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .badge {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #60677a;
      margin-bottom: 8px;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 35px;
    }

    .header-title span {
      background: linear-gradient(90deg, #60a5fa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .deck-container {
      position: relative;
      width: 360px;
      height: 380px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 36px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .card-top {
      text-align: center;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
      transition: color 0.3s;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-dim);
    }

    .deck-arena {
      position: relative;
      width: 220px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Thẻ Slot OTP */
    .slot {
      position: absolute;
      width: 46px;
      height: 64px;
      background: #1d212c;
      border: 1.5px solid #2e3447;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 320%;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .slot input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      caret-color: var(--ice);
    }

    .slot.active {
      border-color: var(--ice);
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.4);
    }

    /* Spinner xoay chờ */
    .spinner-box {
      display: none;
      width: 64px;
      height: 64px;
      position: relative;
    }

    .spinner-box svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      animation: spin 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .seal__seg {
      fill: none;
      stroke: var(--ice);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 160;
      stroke-dashoffset: 80;
      filter: drop-shadow(0 0 8px var(--ice));
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Dấu Tick SVG khi thành công */
    .success-box {
      display: none;
      position: relative;
      width: 68px;
      height: 68px;
    }

    .success-svg {
      width: 100%;
      height: 100%;
    }

    /* Vòng tròn viền xanh bung ra */
    .success-circle {
      fill: none;
      stroke: var(--success);
      stroke-width: 3.5;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.6));
    }

    /* Nét tick vẽ từng nét */
    .success-check {
      fill: none;
      stroke: #fff;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
    }

    .success-box.play .success-circle {
      animation: drawCircle 0.5s ease-out forwards;
    }

    .success-box.play .success-check {
      animation: drawCheck 0.35s 0.35s ease-out forwards;
    }

    @keyframes drawCircle {
      to { stroke-dashoffset: 0; }
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    /* Hạt sáng bung nổ xung quanh (Sparks) */
    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--success);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      opacity: 0;
      box-shadow: 0 0 8px var(--success);
    }

    .footer-action {
      font-size: 13px;
      color: var(--text-dim);
    }

    .footer-action a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
      cursor: pointer;
    }

    .hint-text {
      margin-top: 28px;
      font-size: 13px;
      color: #555b6e;
    }

    .hint-text b {
      color: #7e879c;
    }
  </style>
</head>
<body>

  <div class="badge">Component · 100</div>
  <div class="header-title">OTP Verification <span>DECK</span></div>

  <div class="deck-container">
    <div class="card-top">
      <div class="title" id="statusTitle">Verify your code</div>
      <div class="subtitle" id="statusSub">Enter the 4-digit code sent to you.</div>
    </div>

    <div class="deck-arena" id="arena">
      <!-- 4 lá bài OTP -->
      <div class="slot" data-index="0"><input type="text" maxlength="1" inputmode="numeric"></div>
      <div class="slot" data-index="1"><input type="text" maxlength="1" inputmode="numeric"></div>
      <div class="slot" data-index="2"><input type="text" maxlength="1" inputmode="numeric"></div>
      <div class="slot" data-index="3"><input type="text" maxlength="1" inputmode="numeric"></div>

      <!-- Spinner chờ xoay -->
      <div class="spinner-box" id="spinner">
        <svg viewBox="0 0 50 50">
          <circle class="seal__seg" cx="25" cy="25" r="21"></circle>
        </svg>
      </div>

      <!-- Dấu Tick Neon Bung Nở -->
      <div class="success-box" id="successBox">
        <svg class="success-svg" viewBox="0 0 70 70">
          <circle class="success-circle" cx="35" cy="35" r="30"></circle>
          <path class="success-check" d="M22 36 L31 45 L48 27"></path>
        </svg>
      </div>
    </div>

    <div class="footer-action">
      Didn't get a code? <a href="#" id="resendBtn">Resend</a>
    </div>
  </div>

  <div class="hint-text">
    Nhấn phím <b>Enter — 1234</b> để kiểm tra hiệu ứng tick.
  </div>

  <script>
    const slots = Array.from(document.querySelectorAll('.slot'));
    const inputs = Array.from(document.querySelectorAll('.slot input'));
    const spinner = document.getElementById('spinner');
    const successBox = document.getElementById('successBox');
    const title = document.getElementById('statusTitle');
    const subtitle = document.getElementById('statusSub');
    const arena = document.getElementById('arena');

    const ANG = [-12, -4, 4, 12];
    const dx = [-75, -25, 25, 75];

    // Xòe bài ra
    function spreadCards() {
      slots.forEach((slot, i) => {
        slot.style.display = 'flex';
        slot.animate([
          { transform: 'translate(0, 0) rotate(0deg)', opacity: 0 },
          { transform: `translate(${dx[i]}px, 0) rotate(${ANG[i]}deg)`, opacity: 1 }
        ], {
          duration: 560,
          delay: i * 45,
          fill: 'forwards',
          easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)'
        });
      });
      setTimeout(() => inputs[0].focus(), 300);
    }

    // Hiệu ứng pháo sáng (Sparks) văng ra xung quanh
    function explodeSparks() {
      const count = 12;
      for (let i = 0; i < count; i++) {
        const spark = document.createElement('div');
        spark.classList.add('spark');
        arena.appendChild(spark);

        const angle = (i / count) * 2 * Math.PI;
        const distance = 45 + Math.random() * 20;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;

        spark.animate([
          { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
          { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
        ], {
          duration: 650,
          easing: 'cubic-bezier(0, 0.9, 0.3, 1)'
        }).onfinish = () => spark.remove();
      }
    }

    // Gom bài -> Hiện Spinner xoay -> Hiện Tick đúng
    function triggerVerification() {
      slots.forEach((slot, i) => {
        slot.animate([
          { transform: `translate(${dx[i]}px, 0) rotate(${ANG[i]}deg)`, opacity: 1 },
          { transform: 'translate(0, 0) rotate(0deg)', opacity: 0 }
        ], {
          duration: 350,
          fill: 'forwards',
          easing: 'ease-in'
        });
      });

      setTimeout(() => {
        slots.forEach(s => s.style.display = 'none');
        spinner.style.display = 'block';
        title.textContent = "Checking your code";
        subtitle.textContent = "One moment — we're confirming it.";

        // Giả lập kiểm tra xong sau 1.5s
        setTimeout(() => {
          spinner.style.display = 'none';
          successBox.style.display = 'block';
          successBox.classList.add('play');

          // Nổ pháo sáng ngay khi dấu check vẽ ra
          setTimeout(explodeSparks, 350);

          title.textContent = "Code Verified!";
          title.style.color = "var(--success)";
          subtitle.textContent = "Redirecting you safely...";
        }, 1500);
      }, 350);
    }

    // Xử lý gõ bàn phím
    inputs.forEach((input, index) => {
      input.addEventListener('focus', () => slots[index].classList.add('active'));
      input.addEventListener('blur', () => slots[index].classList.remove('active'));

      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val;
        if (val && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
        if (inputs.every(i => i.value.length === 1)) {
          triggerVerification();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    // Enter phím tắt test mã "1234"
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        '1234'.split('').forEach((num, i) => inputs[i].value = num);
        triggerVerification();
      }
    });

    // Nút Resend để reset chơi lại từ đầu
    document.getElementById('resendBtn').addEventListener('click', (e) => {
      e.preventDefault();
      spinner.style.display = 'none';
      successBox.style.display = 'none';
      successBox.classList.remove('play');
      inputs.forEach(i => i.value = '');
      title.textContent = "Verify your code";
      title.style.color = "var(--text)";
      subtitle.textContent = "Enter the 4-digit code sent to you.";
      spreadCards();
    });

    window.onload = spreadCards;
  </script>
</body>
</html>
