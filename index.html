<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>c0mplex | Profile</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="./assets/favico/default.ico">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- Stylesheet -->
  <link rel="stylesheet" type="text/css" href="styles.css"> 

  <!-- Vanilla Tilt Core -->
  <script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.7.2/dist/vanilla-tilt.min.js"></script>
</head>
<body>

  <!-- Terminal Window -->
  <div id="terminal">
    <div id="terminal-header">
      <div id="terminal-buttons">
        <div class="terminal-button" id="close-button" title="Close"></div>
        <div class="terminal-button" id="minimize-button" title="Minimize"></div>
        <div class="terminal-button" id="maximize-button" title="Maximize"></div>
      </div>
    </div>
    <div id="terminal-content">
      <p id="terminal-text"></p>
    </div>
  </div>

  <!-- Background Video & Controls -->
  <div id="video-background">
    <video autoplay muted loop id="myVideo" playsinline>
      <source src="./assets/back/default.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <div id="audio-background">
      <div id="music-controls">
        <input type="range" id="volume-slider" min="0" max="100" value="50" aria-label="Volume Slider">
        <div id="progress-container">
          <div id="progress-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="video-overlay"></div>

  <!-- Profile Card -->
  <div id="blurred-box" class="tilt-element">
    <img id="profile-picture" src="./assets/pfp/default.png" alt="Profile Picture">
    <img id="avatar-frame" src="" alt="Avatar Frame">

    <p id="username-container">
      <span id="username">c0mplex</span>
      <span id="typing-cursor">|</span>
    </p>

    <!-- Badges -->
    <div class="badges-container">
      <img src="./assets/badge/developer.png" alt="Developer badge">
      <img src="./assets/badge/love.png" alt="Heart badge">
      <img src="./assets/badge/music.png" alt="Music badge">
      <img src="./assets/badge/verified.png" alt="Verified badge">
    </div>

    <!-- Tech Stack / Languages -->
    <div class="lang-container">
      <img src="./assets/logo/c.png" alt="C">
      <img src="./assets/logo/cplusplus.png" alt="C++">
      <img src="./assets/logo/matlab.png" alt="MATLAB">
      <img src="./assets/logo/python.png" alt="Python">
      <img src="./assets/logo/csharp.png" alt="C#">
      <img src="./assets/logo/java.png" alt="Java">
    </div>

    <!-- Bio Description -->
    <div class="user-description-container">
      <p id="user-description-text">
        Hi everyone, I’m c0mplex<br>
        I have a deep interest in exploring Internet of Things<br>
        I’m eager to connect with others and keep learning from new experiences
      </p>
    </div>

    <!-- Discord Presence Widget (Lanyard) -->
    <div class="discord-widget">
      <div class="discord-content">
        <div class="discord-icon">
          <img id="discord-avatar" src="./assets/pfp/default.png" alt="Discord Avatar" draggable="false" loading="lazy">
        </div>
        <div class="discord-meta">
          <b id="discord-username">Loading...</b>
          <div>
            <span id="discord-status-dot" class="status-offline"></span>
            <span id="discord-status-text">OFFLINE</span>
          </div>
        </div>
      </div>
      <div class="discord-activity">
        <div id="discord-activity-info" class="hidden">
          <div id="discord-album-art"></div>
          <div class="discord-activity-content">
            <div id="discord-activity-name"></div>
            <div id="discord-activity-details"></div>
            <div id="discord-activity-state"></div>
          </div>
        </div>
        <div id="discord-no-activity">I'm not currently doing anything!</div>
      </div>
    </div>

    <!-- Social Links -->
    <div class="links"> 
      <a href="https://www.facebook.com/c0mplexisreal" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <i class="fab fa-facebook"></i> 
      </a> 
      <a href="https://github.com/c0mplex07" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <i class="fa-brands fa-github"></i>
      </a> 
      <a href="https://www.tiktok.com/@c0mplex07" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
        <i class="fa-brands fa-tiktok"></i>
      </a> 
      <a href="https://x.com/c0mplex_vn" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
        <i class="fa-brands fa-twitter"></i>
      </a> 
      <a href="mailto:enou456xq@gmail.com" aria-label="Email">
        <i class="fa-brands fa-google mail"></i>
      </a> 
    </div>
  </div>

  <!-- Single Master Script -->
  <script src="script.js"></script>
</body>
</html>
